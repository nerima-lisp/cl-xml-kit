# CI build: nix build .#docs --print-build-logs
# Local preview: run these commands from the repository root:
# python3 -m venv .venv
# . .venv/bin/activate
# python -m pip install mkdocs-material
# mkdocs serve -f docs/mkdocs.yml

site_name: cl-xml-kit
site_description: Bounded XML toolkit for Common Lisp with cl-codec-kit and cl-parser-kit dependencies.
site_author: cl-xml-kit contributors
site_url: https://nerima-lisp.github.io/cl-xml-kit/

repo_name: nerima-lisp/cl-xml-kit
repo_url: https://github.com/nerima-lisp/cl-xml-kit
edit_uri: edit/main/docs/src/

# MkDocs resolves these paths relative to this configuration file.
docs_dir: src
site_dir: ../site
use_directory_urls: true
strict: true

copyright: Copyright &copy; cl-xml-kit contributors | MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/xml
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-xml-kit
      name: cl-xml-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - API reference: api.md
  - Architecture: architecture.md
  - Migration to 2.0.0: migration.md
  - Benchmark guide: https://github.com/nerima-lisp/cl-xml-kit/blob/main/benchmark/README.md

